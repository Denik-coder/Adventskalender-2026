# Holt den Speiseplan der Mensa Ravensburg einmal taeglich und legt ihn als mensa.xml ab.
# Dadurch laedt die Website den Plan von der eigenen Adresse und der Browser blockiert nichts.
name: Mensaplan aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"      # taeglich 4:17 UTC
  workflow_dispatch:           # Knopf zum manuellen Starten

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Speiseplan herunterladen
        run: |
          curl -fsS --retry 3 --max-time 60 \
            "https://www.max-manager.de/daten-extern/seezeit/xml/mensa_ravensburg/speiseplan.xml" \
            -o mensa.xml
          head -c 200 mensa.xml

      - name: Aenderung speichern
        run: |
          if git diff --quiet -- mensa.xml; then
            echo "Keine Aenderung."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mensa.xml
          git commit -m "Mensaplan aktualisiert"
          git push
